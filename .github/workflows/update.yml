name: Update stats

on:
  schedule:
    - cron: "17 9 * * *"     # every day ~5am Montreal time
  workflow_dispatch:          # "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python update.py
      - name: Commit new sheets + site
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add sheets data docs
          git diff --cached --quiet || git commit -m "Update stats $(date -u +%F)"
          git push