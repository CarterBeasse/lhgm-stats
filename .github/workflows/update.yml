name: Update stats

on:
  schedule:
    - cron: "17 5,17 * * *"   # ~1am and ~1pm Montreal time
  workflow_dispatch:           # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-stats          # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python update.py
      - name: Commit new stats + site
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Update stats $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push
